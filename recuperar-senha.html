<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar senha — SnapBite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#f4f7ff;color:#091224;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{width:100%;max-width:520px;background:#fff;border-radius:28px;padding:38px;box-shadow:0 20px 60px rgba(0,51,153,.12)}
.logo{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:#E30613;margin-bottom:24px}
.logo em{color:#003399}
h1{font-size:2rem;margin-bottom:10px}
p{color:#5d6785;line-height:1.7}
.email-box{margin:24px 0;background:#eef2ff;border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;font-weight:700;color:#003399}
.edit-btn,.resend-btn,.continue-btn{border:none;cursor:pointer;transition:.2s}
.edit-btn{background:none;color:#003399;font-weight:700;padding:0;margin-bottom:24px}
.code-inputs{display:flex;gap:10px;justify-content:center;margin:32px 0}
.code{width:58px;height:68px;border-radius:16px;border:2px solid #dce4ff;text-align:center;font-size:1.5rem;font-weight:700;outline:none}
.code:focus{border-color:#003399;box-shadow:0 0 0 4px rgba(0,51,153,.1)}
.resend-btn{width:100%;padding:14px;border-radius:14px;background:#edf2ff;color:#003399;font-weight:700;margin-bottom:16px}
.resend-btn:disabled{opacity:.6;cursor:not-allowed}
.continue-btn{width:100%;padding:16px;border-radius:16px;background:#003399;color:#fff;font-weight:700;font-size:1rem}
.feedback{margin-top:18px;padding:14px;border-radius:14px;display:none}
.feedback.show{display:block}.success{background:#ebfff1;color:#118a43}.error{background:#fff0f0;color:#d92d20}
.password-area{display:none;margin-top:26px}.password-area.active{display:block}
.input{width:100%;padding:16px;border-radius:14px;border:2px solid #dce4ff;margin-bottom:14px;font-size:1rem}
.rules{background:#f7f9ff;border-radius:16px;padding:16px;color:#5d6785}
.rules li{margin-bottom:8px}
</style>
</head>
<body>
<div class="card">
<div class="logo">Snap<em>Bite</em></div>
<h1>Verifique seu e-mail</h1>
<p>Enviamos um código de verificação para o e-mail abaixo. Digite o código para continuar redefinindo sua senha.</p>
<div class="email-box"><i class="fa-solid fa-envelope"></i><span id="emailText"></span></div>
<button class="edit-btn" id="editEmailBtn">Editar e-mail</button>
<div class="code-inputs">
<input maxlength="1" class="code">
<input maxlength="1" class="code">
<input maxlength="1" class="code">
<input maxlength="1" class="code">
<input maxlength="1" class="code">
<input maxlength="1" class="code">
</div>
<button class="resend-btn" id="resendBtn" disabled>Reenviar código em 60s</button>
<button class="continue-btn" id="continueBtn">Continuar</button>
<div class="password-area" id="passwordArea">
<h2>Crie uma nova senha</h2>
<input type="password" class="input" id="newPassword" placeholder="Nova senha">
<input type="password" class="input" id="confirmPassword" placeholder="Confirmar senha">
<ul class="rules">
<li>Mínimo de 8 caracteres</li>
<li>Uma letra maiúscula</li>
<li>Um número</li>
</ul>
<button class="continue-btn" id="savePasswordBtn" style="margin-top:18px">Salvar nova senha</button>
</div>
<div class="feedback" id="feedback"></div>
</div>
<script>
const email = localStorage.getItem('snapbite_recovery_email');
if(!email){window.location.href='login.html';}
document.getElementById('emailText').textContent=email;
const feedback=document.getElementById('feedback');
function showFeedback(msg,type){feedback.className='feedback show '+type;feedback.textContent=msg;}

document.getElementById('editEmailBtn').addEventListener('click',()=>{
localStorage.removeItem('snapbite_recovery_email');
window.location.href='login.html';
});

const inputs=document.querySelectorAll('.code');
inputs.forEach((input,index)=>{
input.addEventListener('input',(e)=>{
const value=e.target.value.replace(/\D/g,'');
input.value=value;
if(value && index<inputs.length-1){inputs[index+1].focus();}
});
input.addEventListener('keydown',(e)=>{
if(e.key==='Backspace' && !input.value && index>0){inputs[index-1].focus();}
});
});

let tempo=60;
const resendBtn=document.getElementById('resendBtn');
const timer=setInterval(()=>{
tempo--;
resendBtn.textContent=`Reenviar código em ${tempo}s`;
if(tempo<=0){clearInterval(timer);resendBtn.disabled=false;resendBtn.textContent='Reenviar código';}
},1000);

resendBtn.addEventListener('click',()=>{
const novoCodigo=Math.floor(100000 + Math.random() * 900000).toString();
localStorage.setItem('snapbite_recovery_code',novoCodigo);
localStorage.setItem('snapbite_recovery_expires',String(Date.now() + (5 * 60 * 1000)));
showFeedback('Novo código enviado com sucesso.','success');
resendBtn.disabled=true;
let novoTempo=60;
resendBtn.textContent=`Reenviar código em ${novoTempo}s`;
const novoTimer=setInterval(()=>{
novoTempo--;
resendBtn.textContent=`Reenviar código em ${novoTempo}s`;
if(novoTempo<=0){clearInterval(novoTimer);resendBtn.disabled=false;resendBtn.textContent='Reenviar código';}
},1000);
});

document.getElementById('continueBtn').addEventListener('click',()=>{
const codigo=Array.from(inputs).map(i=>i.value).join('');
const salvo=localStorage.getItem('snapbite_recovery_code');
const expires=Number(localStorage.getItem('snapbite_recovery_expires'));
if(Date.now()>expires){showFeedback('Esse código expirou. Solicite outro.','error');return;}
if(codigo!==salvo){showFeedback('O código digitado está incorreto.','error');return;}
showFeedback('Código confirmado com sucesso.','success');
document.getElementById('passwordArea').classList.add('active');
});

document.getElementById('savePasswordBtn').addEventListener('click',()=>{
const senha=document.getElementById('newPassword').value;
const confirmar=document.getElementById('confirmPassword').value;
if(senha.length<8){showFeedback('A senha precisa ter pelo menos 8 caracteres.','error');return;}
if(senha!==confirmar){showFeedback('As senhas não coincidem.','error');return;}
showFeedback('Senha redefinida com sucesso. Faça login novamente.','success');
setTimeout(()=>{window.location.href='login.html';},1800);
});
</script>
</body>
</html>
